<mat-toolbar  class="app-navbar shadow-sm sticky-top">
  <div class="container d-flex justify-content-between align-items-center">
    <a routerLink="/dashboard" class="text-white text-decoration-none d-flex align-items-center gap-2">
      <mat-icon>work_outline</mat-icon>
      <span class="fw-semibold fs-5">Job Tracker</span>
    </a>

    @if (authService.isLoggedIn()) {
      <div class="d-flex align-items-center gap-2">
        <a mat-button routerLink="/dashboard" routerLinkActive="bg-white bg-opacity-25">
          My Applications
        </a>

        @if (authService.isAdmin()) {
          <a mat-button routerLink="/admin" routerLinkActive="bg-white bg-opacity-25">
            Admin Overview
          </a>
        }

        <button mat-button [matMenuTriggerFor]="userMenu" class="ms-2">
          <mat-icon>account_circle</mat-icon>
          <span class="d-none d-sm-inline ms-1">{{ authService.currentUser()?.fullName }}</span>
        </button>

        <mat-menu #userMenu="matMenu">
          <div class="px-3 py-2 border-bottom">
            <div class="fw-medium small">{{ authService.currentUser()?.email }}</div>
            <span class="badge bg-secondary mt-1">{{ authService.currentUser()?.role }}</span>
          </div>
          <button mat-menu-item (click)="authService.logout()">
            <mat-icon color="warn">logout</mat-icon>
            <span>Logout</span>
          </button>
        </mat-menu>
      </div>
    }
  </div>
</mat-toolbar>
